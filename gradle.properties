org.gradle.jvmargs=-Xmx3072m -XX:MaxMetaspaceSize=1024m -XX:+UseSerialGC -Dfile.encoding=UTF-8
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

org.gradle.workers.max=2
org.gradle.parallel=false
org.gradle.internal.repository.max.retries=10
org.gradle.internal.repository.initial.backoff=500
android.enableAapt2Daemon=false
android.aapt2FromMavenOverride=/opt/aapt2/aapt2
kotlin.compiler.execution.strategy=in-process

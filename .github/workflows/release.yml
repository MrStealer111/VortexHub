name: Release APK
on:
  workflow_dispatch:
    inputs:
      abi:
        description: 'ABIs to package'
        required: true
        default: 'arm64-v8a,armeabi-v7a'
permissions:
  contents: read
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
      - name: Build release
        env:
          KEYSTORE_B64: ${{ secrets.VORTEXHUB_KEYSTORE_BASE64 }}
          VORTEXHUB_KEYSTORE_PASSWORD: ${{ secrets.VORTEXHUB_KEYSTORE_PASSWORD }}
          VORTEXHUB_KEY_ALIAS: ${{ secrets.VORTEXHUB_KEY_ALIAS }}
          VORTEXHUB_KEY_PASSWORD: ${{ secrets.VORTEXHUB_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            export VORTEXHUB_KEYSTORE="$RUNNER_TEMP/release.keystore"
          fi
          ./gradlew --no-daemon :app:assembleRelease -PtestAbi="${{ inputs.abi }}"
      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: VortexHub-release
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

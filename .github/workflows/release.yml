name: Release APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      abi:
        description: 'ABIs to package'
        required: true
        default: 'arm64-v8a,armeabi-v7a'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace :app:testDebugUnitTest

      - name: Require signing keystore for tagged releases
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          KEYSTORE_B64: ${{ secrets.VORTEXHUB_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::warning::No signing keystore secret; publishing unsigned APK."
          fi

      - name: Build release
        env:
          KEYSTORE_B64: ${{ secrets.VORTEXHUB_KEYSTORE_BASE64 }}
          VORTEXHUB_KEYSTORE_PASSWORD: ${{ secrets.VORTEXHUB_KEYSTORE_PASSWORD }}
          VORTEXHUB_KEY_ALIAS: ${{ secrets.VORTEXHUB_KEY_ALIAS }}
          VORTEXHUB_KEY_PASSWORD: ${{ secrets.VORTEXHUB_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            export VORTEXHUB_KEYSTORE="$RUNNER_TEMP/release.keystore"
          else
            echo "::warning::No signing keystore provided; the APK will be unsigned."
          fi
          ./gradlew --no-daemon --stacktrace :app:assembleRelease -PtestAbi="${{ inputs.abi || 'arm64-v8a,armeabi-v7a' }}"

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: VortexHub-release
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/release/*.apk
          generate_release_notes: true
          draft: false
          prerelease: false
